[project]
name = "swfactory"
version = "0.1.0"
description = "Software factory platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "sqlalchemy[asyncio]~=2.1",
    "psycopg[binary,pool]~=3.3",
    "alembic~=1.20",
]

[project.scripts]
factory = "swfactory.cli.main:app"

[project.entry-points.pytest11]
factory_ci = "swfactory.testing.pytest_ci"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swfactory"]

[tool.hatch.build.targets.wheel.force-include]
"defaults" = "swfactory/_defaults"
"schema/definition.schema.json" = "swfactory/_schema/definition.schema.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs the compose Postgres, connecting through FACTORY_TEST_DATABASE_URL",
    "docker: needs the Docker daemon",
    "live: calls real providers",
    "e2e: the full loop with real models",
    "ui: dashboard tests with Playwright and local Chromium, no Docker, database or network",
]
addopts = "--strict-markers -m 'not db and not docker and not live and not e2e and not ui'"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
