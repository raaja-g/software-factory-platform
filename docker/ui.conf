# The dashboard, served on its own: the static files, plus two forwards to the API so the browser
# talks to a single origin (no CORS, and the session cookie stays on the UI's origin).
#   /api/*  every call the dashboard makes (including the /api/events stream)
#   /login  one-time login link -> session cookie
# Everything else is a static file, GET and HEAD only. The API's other routes (webhooks, health)
# are not reachable through here.
server {
    listen 7000;
    server_name _;
    server_tokens off;

    # Docker's embedded DNS; the variable makes nginx look `api` up again after the container is
    # recreated instead of keeping the address it found at start.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:7080;

    root /usr/share/nginx/html;
    index index.html;

    location = /ui-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;  # the event stream must not be held back
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /login {
        limit_except GET {
            deny all;
        }
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # static files: the same headers the API puts on them
    location / {
        limit_except GET HEAD {
            deny all;
        }
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ =404;
    }
}
