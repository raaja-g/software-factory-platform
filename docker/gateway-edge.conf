# Allowlist proxy in front of the LiteLLM gateway. Sandboxes reach only these model routes;
# everything else (key minting, spend, admin UI, provider pass-through) answers 403.
# Keep the `location ~` lines in step with EDGE_ALLOWED_PATHS in src/swfactory/settings.py.
server {
    listen 4000;
    server_name _;

    # Docker's embedded DNS; the variable below makes nginx look `gateway` up again after the
    # container is recreated instead of keeping the address it found at start.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:4000;

    client_max_body_size 64m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/v1/chat/completions$ {
        proxy_pass $gateway;
    }

    location ~ ^/v1/messages$ {
        proxy_pass $gateway;
    }

    location ~ ^/v1/messages/count_tokens$ {
        proxy_pass $gateway;
    }

    location ~ ^/v1/models$ {
        proxy_pass $gateway;
    }

    location ~ ^/v1beta/models/[^/]+:(generateContent|streamGenerateContent|countTokens)$ {
        proxy_pass $gateway;
    }

    location / {
        default_type application/json;
        return 403 '{"error":"route not allowed"}\n';
    }
}
