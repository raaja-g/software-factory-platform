title: Add a todo command line
feature: Add a `todo` CLI (`python -m app.todo add|list|done <n>`) storing items in
  a JSON file in the user's home directory
success_criteria:
- 'AC1 — `python -m app.todo add buy milk` (run from `src/`) exits 0, prints `Added
  #1: buy milk`, and creates `~/.todo.json` with `{"items": [{"text": "buy milk",
  "done": false}]}`.'
- AC2 — `list` prints the items in insertion order as `1. [ ] buy milk`, `2. [x] call
  bob`, and so on, and exits 0.
- AC3 — `list` with no storage file prints `No todos.`, exits 0, and does **not**
  create the file.
- 'AC4 — `done 2` marks item 2 done, prints `Done #2: <text>`, exits 0. A later `list`
  shows `[x]` for it and the numbering is unchanged.'
- 'AC5 — `done 0`, `done 99` (out of range), or `done` on an empty list prints `error:
  ...` to stderr, exits 1, and leaves the file unchanged.'
- AC6 — `done abc` and a missing or unknown subcommand exit 2 with a usage message
  on stderr.
- AC7 — `add` with empty or whitespace-only text (for example `add "   "`) prints
  an error to stderr, exits 1, and adds nothing.
- 'AC8 — If `~/.todo.json` holds invalid JSON or the wrong shape, every command prints
  `error: ...` (naming the file) to stderr, exits 1, and leaves the file byte-for-byte
  unchanged.'
- AC9 — Items persist across separate process invocations, so `add`/`add`/`done`/`list`
  run as separate subprocesses give consistent results.
- 'AC10 — A file created by the CLI has permissions `0o600`. Saves are atomic: temp
  file plus `os.replace`, and no stray temp files are left in the directory afterwards.'
- AC11 — Unicode text round-trips (for example `add café ☕` then `list` shows it unchanged).
- AC12 — The storage functions (`load_items`, `save_items`, `add_item`, `complete_item`,
  `default_path`) can be imported from `app.todo` and accept an explicit `path`.
- AC13 — `README.md` documents the todo CLI and its storage location. `CLAUDE.md`
  Run line mentions it. No files under `factory/` are changed.
- AC14 — `make test` passes, including the existing smoke tests.
