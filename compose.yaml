# Local release stack (M7.7). Third-party images are pinned by digest (looked up at build time; M0 must confirm).
x-platform-env: &platform-env
  FACTORY_MODE: personal
  FACTORY_DATABASE_URL: postgresql+psycopg://factory@postgres:5432/factory
  FACTORY_DATABASE_PASSWORD_FILE: /run/secrets/pg_password
  FACTORY_DEFINITION: /definition
  FACTORY_ARTIFACTS_DIR: /var/lib/factory/artifacts
  FACTORY_IN_CONTAINER: "1"
  FACTORY_HOST_HOME: ${HOME}
  FACTORY_NOTIFY_WEBHOOK_URL: ${FACTORY_NOTIFY_WEBHOOK_URL:-}
  FACTORY_DISK_HIGH_WATER_PCT: ${FACTORY_DISK_HIGH_WATER_PCT:-85}  # the worker starts no new job above this

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: factory
      POSTGRES_DB: factory
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - idle_in_transaction_session_timeout=300s
    restart: unless-stopped
    networks: [core-net]

  # One-shot: applies the platform's database migrations.
  migrate:
    image: swfactory-platform:dev
    command: ["db", "upgrade"]
    environment:
      <<: *platform-env
    secrets:
      - pg_password
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core-net]

  api:
    image: swfactory-platform:dev
    build:
      context: .
      dockerfile: docker/platform.Dockerfile
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *platform-env
      FACTORY_API_TOKEN_FILE: /run/secrets/api_token
      FACTORY_BROKER_TOKEN_FILE: /run/secrets/broker_token
      FACTORY_DB_STATEMENT_TIMEOUT_S: "30"
      FACTORY_HOST_REPOS_ROOT: ${FACTORY_HOST_REPOS_ROOT:-}
    secrets:
      - pg_password
      - api_token
      - broker_token
    volumes:
      - ${FACTORY_DEFINITION_PATH}:/definition
      - artifacts:/var/lib/factory/artifacts
      - repos:/repos:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8080/readyz', headers={'Host': '127.0.0.1'}), timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [core-net]

  # Runs the worker: claims jobs, drives sandboxes through the filtered Docker proxy, and holds
  # the gateway master key (only this service does, section 5).
  orchestrator:
    image: swfactory-platform:dev
    command: ["worker"]
    environment:
      <<: *platform-env
      DOCKER_HOST: tcp://docker-proxy:2375
      FACTORY_REPOS_DIR: /repos
      FACTORY_HOST_REPOS_ROOT: ${FACTORY_HOST_REPOS_ROOT}
      FACTORY_GATEWAY_URL: http://gateway:4000
      FACTORY_GATEWAY_SANDBOX_URL: http://gateway-edge:4000
      FACTORY_GATEWAY_CONFIG: /gateway-config/litellm.yaml
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      FACTORY_BROKER_TOKEN_FILE: /run/secrets/broker_token
      FACTORY_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_key
      FACTORY_LAYA_URL: ${FACTORY_LAYA_URL:-}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      FACTORY_LAYA_EXPORT_DIR: /var/lib/factory/artifacts/laya
    # The token broker listens on 8091 inside core-net only; it is never published.
    secrets:
      - pg_password
      - broker_token
      - github_app_key
    volumes:
      - repos:/repos
      - artifacts:/var/lib/factory/artifacts
      - gateway-config:/gateway-config
      - ${FACTORY_DEFINITION_PATH}:/definition
      - ${FACTORY_HOST_REPOS_ROOT:?set FACTORY_HOST_REPOS_ROOT in .env}:/host-repos
    stop_grace_period: 60s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    networks: [core-net, docker-net]

  # Narrow Docker API for the orchestrator (M7.7). No authentication: nothing else may join docker-net.
  # Digest looked up at build time (3.4.7-r0-ls106); M0 must confirm.
  docker-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7-r0-ls106@sha256:18289eeb306e8e3b70901ffec23eafbb318d73b4514d0bd737dbfc7c5b4fe506
    environment:
      CONTAINERS: "1"
      POST: "1"
      EXEC: "1"
      ALLOW_ARCHIVE: "1"        # copy files into and out of a sandbox (put/get archive); denied by default
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      BUILD: "0"
      SECRETS: "0"
      AUTH: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run]
    restart: unless-stopped
    networks: [docker-net]

  # LiteLLM gateway (M5.2). Image digest looked up at build time (1.108.5); M0 must confirm.
  # Never attached to a job network: sandboxes reach it only through gateway-edge.
  gateway:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-non_root@sha256:838394862b1cbe4d0b295d41e43587c0c4e1cd21a43056b6a0655716375bb819}
    user: "65534"
    command: ["--config", "/gateway-config/litellm.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-}@postgres:5432/litellm
      DISABLE_SCHEMA_UPDATE: "true"
      STORE_MODEL_IN_DB: "False"
      DISABLE_ADMIN_UI: "True"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - gateway-config:/gateway-config:ro
      - ${GCLOUD_ADC_FILE:-${HOME}/.config/gcloud/application_default_credentials.json}:/secrets/adc.json:ro
    ports:
      - "127.0.0.1:4000:4000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      gateway-init:
        condition: service_completed_successfully
    networks: [core-net]

  # One-shot: renders the active definition into the gateway-config volume (no host file to go missing).
  gateway-init:
    image: swfactory-platform:dev
    command: ["gateway", "render", "--active", "--out", "/gateway-config/litellm.yaml"]
    environment:
      <<: *platform-env
    secrets:
      - pg_password
    volumes:
      - ${FACTORY_DEFINITION_PATH}:/definition:ro
      - gateway-config:/gateway-config
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [core-net]

  # Allowlist proxy: forwards only the model routes in docker/gateway-edge.conf. M4.3b connects it
  # to each factory-net-<job> network (alias gateway-edge) at run time.
  # Digest looked up at build time (nginx-unprivileged 1.29-alpine); M0 must confirm.
  gateway-edge:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    volumes:
      - ./docker/gateway-edge.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/edge-health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [core-net]

  # One-shot: creates role and database `litellm` if missing.
  gateway-db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    command: ["bash", "/litellm-db.sh"]
    environment:
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-}
    secrets:
      - pg_password
    volumes:
      - ./docker/litellm-db.sh:/litellm-db.sh:ro
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core-net]

  # One-shot: applies LiteLLM's database migrations (the gateway runs with DISABLE_SCHEMA_UPDATE).
  gateway-migrate:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-non_root@sha256:838394862b1cbe4d0b295d41e43587c0c4e1cd21a43056b6a0655716375bb819}
    user: "65534"
    entrypoint: []
    command: ["python", "litellm/proxy/prisma_migration.py"]
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
    restart: "no"
    depends_on:
      gateway-db:
        condition: service_completed_successfully
    networks: [core-net]

  # Package mirror (M7.7c): the only package source job networks reach. Verdaccio serves npm; it never
  # accepts a publish. Digest looked up at build time (verdaccio 6); M0 (S13) must confirm.
  # M7.7c attaches it to each job network (alias pkg-mirror) at run time, like gateway-edge.
  pkg-mirror:
    image: ${PKG_MIRROR_NPM_IMAGE:-verdaccio/verdaccio@sha256:8c9cd40d28ef134140f4f6c4cef2032ac58bd554cce56757048f81b72717c09c}
    user: "10001"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - pkg-cache-npm:/verdaccio/storage
      - pkg-auth:/pkg-auth:ro
      - ./deploy/pkg-mirror/npm-entrypoint.sh:/entrypoint.sh:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4873/-/ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    depends_on:
      pkg-mirror-auth:
        condition: service_healthy
    networks: [mirror-net]

  # Read-only PyPI proxy with name-prefix routing (deploy/pkg-mirror/pypi_proxy.py). Shares pkg-mirror's
  # network namespace, so the alias pkg-mirror serves port 3141 as well.
  pkg-mirror-pypi:
    image: ${PKG_MIRROR_PYPI_IMAGE:-python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90}
    user: "10001"
    network_mode: service:pkg-mirror
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - pkg-cache-pypi:/var/cache/pkg-mirror
      - pkg-auth:/pkg-auth:ro
      - ./deploy/pkg-mirror/pypi-entrypoint.sh:/entrypoint.sh:ro
      - ./deploy/pkg-mirror/pypi_proxy.py:/opt/pkg-mirror/pypi_proxy.py:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      pkg-mirror:
        condition: service_healthy

  # Token sidecar: the only holder of registry credentials (.env and the registry ADC secret). Renders
  # the mirror's config from the definition into the pkg-auth volume.
  pkg-mirror-auth:
    image: swfactory-platform:dev
    command: ["mirror", "run", "--out", "/pkg-auth"]
    environment:
      FACTORY_MODE: personal
      FACTORY_DATABASE_URL: postgresql+psycopg://none@localhost/none
      FACTORY_DEFINITION: /definition
      FACTORY_REGISTRY_ENV_FILE: /run/factory-env
      FACTORY_REGISTRY_ADC_FILE: /run/secrets/registry_credentials
      FACTORY_MIRROR_OUT_DIR: /pkg-auth
      FACTORY_BROKER_URL: http://orchestrator:8091
      FACTORY_BROKER_TOKEN_FILE: /run/secrets/broker_token
    secrets:
      - registry_credentials
      - broker_token
    volumes:
      - ${FACTORY_DEFINITION_PATH}:/definition:ro
      - ./.env:/run/factory-env:ro
      - pkg-auth:/pkg-auth
    healthcheck:
      test: ["CMD", "test", "-f", "/pkg-auth/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [mirror-net, core-net]

  # Optional Laya router (M11.1), profile `laya`. Core network only: the orchestrator reaches it here
  # and nothing on a job network can. Weights are baked into the image; no network is needed.
  # mem_limit: measured 2.0 GiB resident with the English checkpoint, times 1.5.
  router:
    profiles: [laya]
    image: swfactory-router:dev
    build:
      context: .
      dockerfile: docker/router.Dockerfile
    environment:
      # Empty means the shim refuses to start. A required-variable (:?) form here would make every
      # compose command fail for anyone not running the profile.
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_PRELOAD: "1"
      LAYA_MAX_LOADED: "1"
    volumes:
      - laya-heads:/heads
    mem_limit: 3g
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped
    networks: [core-net]

  runner:
    profiles: [build]
    image: swfactory/runner:0.1.0
    build:
      context: .
      dockerfile: docker/runner.Dockerfile

  runner-web:
    profiles: [build]
    image: swfactory/runner-web:0.1.0
    build:
      context: .
      dockerfile: docker/runner-web.Dockerfile
    depends_on:
      - runner

networks:
  core-net: {}
  docker-net:
    internal: true
  # A plain bridge with internet: the mirror's own way out. Only pkg-mirror and pkg-mirror-auth join.
  mirror-net: {}
  # Internet egress for gitops containers only (fixed name); no compose service joins it. M13.2 routes it via the egress proxy.
  gitops-net:
    name: gitops-net

volumes:
  pgdata:
  repos: {}
  artifacts: {}
  gateway-config: {}
  pkg-cache-npm: {}
  pkg-cache-pypi: {}
  pkg-auth: {}
  laya-heads: {}

secrets:
  pg_password:
    file: ./secrets/pg_password
  api_token:
    file: ./secrets/api_token
  broker_token:
    file: ./secrets/broker_token
  github_app_key:
    file: ./secrets/github_app_key.pem
  registry_credentials:
    file: ./secrets/registry-credentials.json
